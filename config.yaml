# Full run: produces every number in the paper. `make reproduce` uses this file.
# Needs Malimg (and BIG 2015 for e3) in data/ — see data/README.md.
#   config.quick.yaml  1 seed, fewer folds, BIG 2015 subset (inherits from this file)
#   config.ci.yaml     synthetic data, tiny CNN; used by CI and the smoke tests
#
# Reproduction parameters are tagged "[1]" when Nataraj et al. (2011) state them,
# or "A<n>" when [1] does not and the value is our assumption. A1-A23 are listed
# with their reasons in report/main.tex (Table "Reproduction parameters").

seeds: [0, 1, 2, 3, 4]

run:
  experiments: [e1, e2, e3, e4]
  models: [gist_knn, cnn, byte_hist_lr]
  # metrics.json headline = first entry that produced results
  headline: [e1/gist_knn, e1/cnn, e1/byte_hist_lr]

experiments:
  e1: {dataset: malimg, split: stratified}   # RQ1: reproduction of [1] (split assumed, A1)
  e2: {dataset: malimg, split: grouped}      # RQ2: duplicates kept inside one fold
  e3: {dataset: big2015, split: grouped}     # RQ3: same pipeline, other dataset
  e4: {attack_on: e2}                        # RQ4: attacks on E2's test folds and models

data:
  source: real             # real | synthetic (synthetic replaces every dataset; CI only)
  malimg_dir: data/malimg_paper_dataset_imgs
  big2015_dir: data/extracted     # train/<Id>.bytes + trainLabels.csv; only extracted ids are used
  big2015_ids: data/big2015_subset.txt  # committed list of the 2,042 sample ids used (null = all extracted)
  big2015_subset: null     # int → further stratified subset (applied after big2015_ids)
  # Samples left out of the subset list, with the reason. Every byte of
  # fRLS3aKkijp4GH0Ds6Pv (Ramnit) is "??", so nothing is left once "??" is dropped.
  big2015_exclude: [fRLS3aKkijp4GH0Ds6Pv]
  cache_dir: data/cache
  # [1] width table: file size in KB → byteplot width; [upper bound (exclusive), width].
  # A5: 1 KB = 1,024 bytes. A6: a range's lower bound is inclusive. A8: last row zero-padded.
  width_table: [[10, 32], [30, 64], [60, 128], [100, 256], [200, 384],
                [500, 512], [1000, 768], [null, 1024]]
  synthetic: {n_families: 5, per_family: 30, dup_rate: 0.2, min_kb: 2, max_kb: 40}

splits:
  n_folds: 10              # A1: [1] does not state its split; stratified 10-fold

dedup:
  feature: gist            # gist | thumbnail — descriptor for near-duplicate distance
  # A24: GIST distance below which two samples count as near-duplicates (null = exact
  # duplicates only). 0.05 lies below the valley (~0.07) that separates the duplicate
  # spike from the typical same-family distance (~0.12) in e2/nn_distance_hist.png;
  # scripts/dedup_threshold.py reports the sensitivity to this value.
  near_threshold: 0.05

features:
  # [1]: 4 scales, 8 orientations, N = 20 sub-bands, M = 4 (4x4 grid) → 320-D.
  # A2: image_size (not stated in [1]). A4: split of the 20 sub-bands over the 4 scales,
  # finest scale first (not stated in [1]). A7: block mean over the 4x4 grid.
  # A9-A12 (filter shapes, fixed in src/features.py): centre 0.3 cycles/px /1.85 per
  # scale, radial sigma 0.2, angular sigma (pi/n)/2.355, one-sided 0-180 deg.
  # A13-A16 (prefilter, fixed in src/features.py): 0-255 + log(x+1), 5 px mirror pad,
  # Gaussian whitening at 4 cycles/image, contrast normalisation with constant 0.2.
  # A17-A19 (fixed in src/features.py): block means; 32 px mirror pad before the Gabor
  # filters; response magnitude. image_size must be divisible by blocks.
  gist: {image_size: 64, orientations: [8, 4, 4, 4], blocks: 4}
  thumbnail_size: 32

models:
  gist_knn: {k: 3}         # [1]: k-NN, Euclidean. A3: k not stated in [1]
  byte_hist_lr: {C: 1.0, max_iter: 3000}
  cnn:
    backbone: resnet50     # torchvision name; resnet18 is a cheaper fallback
    pretrained: true       # ImageNet weights (downloaded once by torchvision)
    freeze_backbone: false # true = train the head only (no-GPU fallback)
    input_size: 224
    epochs: 5
    batch_size: 64
    lr: 0.0001
    weight_decay: 0.0001
    class_weighted: true
    max_folds: null        # run only the first N folds of each seed (null = all)

attack:
  budgets: [0, 0.01, 0.02, 0.05, 0.10]
  types: [random, zero, other_family, fgsm]
  # A22: single-step FGSM step in [0,1] pixel units, appended bytes only. Chosen with
  # scripts/fgsm_eps_pilot.py on a separate pilot model (eps 1.0 overshoots).
  fgsm_eps: 0.05

output:
  dir: results
